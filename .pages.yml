media:
  input: public/uploads
  output: https://rererego.github.io/Firefly/uploads
  categories: [image]
content:
  - name: posts
    label: 文章管理
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, published, draft, category]
      sort: published
      order: desc
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: published, label: 发布日期, type: date, required: true }
      - { name: updated, label: 最后修改日期, type: date }
      - { name: description, label: 摘要, type: text }
      - { name: category, label: 分类, type: string }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: image, label: 封面图片, type: image }
      - name: draft
        label: 草稿（关闭后公开发布）
        type: boolean
        default: true
      - { name: pinned, label: 置顶, type: boolean, default: false }
      - { name: body, label: 正文, type: rich-text }
  - name: site
    label: 站点与首页设置
    type: file
    path: src/config/authorSettings.json
    format: json
    fields:
      - { name: title, label: 博客名称（含导航栏）, type: string, required: true }
      - { name: subtitle, label: 站点副标题, type: string }
      - { name: description, label: 站点描述, type: text }
      - { name: name, label: 作者昵称, type: string, required: true }
      - { name: bio, label: 个人简介, type: text }
      - { name: heroTitle, label: 首页横幅标题, type: string, required: true }
      - { name: heroSubtitles, label: 首页轮播标语, type: string, list: true }
  - name: about
    label: 关于我
    type: file
    path: src/content/spec/about.md
    format: yaml-frontmatter
    fields:
      - { name: body, label: 正文, type: rich-text }
actions:
  - name: deploy
    label: 发布网站
    workflow: deploy.yml
    ref: master
